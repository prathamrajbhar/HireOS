# Production stack for the self-hosted server (API + AI service).
# Host networking so the containers reach the server's own Redis (6379) and
# LocalStack (4566) on localhost. resolv.prod.conf: the server's resolvers can't
# resolve the Neon hostname, so containers use public DNS. The frontend is on Vercel; the DB is external (.env).
name: hireos

services:
  ai-service:
    build:
      context: ./apps/ai-service
    restart: unless-stopped
    network_mode: host
    env_file: .env
    volumes:
      - ./resolv.prod.conf:/etc/resolv.conf:ro
    environment:
      AI_PORT: 8012
      AI_HOST: 0.0.0.0
      AI_ENVIRONMENT: production
      API_BASE_URL: http://localhost:4012/api/v1
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8012/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      PORT: 4012
      NODE_ENV: production
      AI_BASE_URL: http://localhost:8012
    volumes:
      - ./resolv.prod.conf:/etc/resolv.conf:ro
      - api_uploads:/app/apps/api/uploads
    depends_on:
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4012/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

volumes:
  api_uploads:
